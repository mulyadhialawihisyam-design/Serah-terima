<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Over J&T Cargo Scanner</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header / Navbar -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400">
                    <i class="fa-solid fa-truck-fast text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight text-white">Hand Over J&T Cargo</h1>
                    <p class="text-xs text-slate-400">Serah Terima Delivery Order & Invoice</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-medium">Online</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 mt-5 space-y-5">

        <!-- Card Pilihan Kode DO -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-2">
            <label class="block text-xs font-semibold text-slate-300">
                <i class="fa-solid fa-file-invoice text-red-400 mr-1.5"></i> Pilih / Input Kode Delivery Order (DO)
            </label>
            <div class="flex gap-2">
                <select id="doSelect" onchange="onDOChange()" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-red-500 transition">
                    <option value="">-- Memuat Daftar DO --</option>
                </select>
                <button onclick="loadDOList()" title="Refresh Daftar DO" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3.5 py-2.5 rounded-xl text-xs font-medium transition">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- 3 STATISTIC CARDS -->
        <div class="grid grid-cols-3 gap-3">
            <!-- Card 1: Total DO -->
            <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-3.5 text-center shadow-md">
                <p class="text-[10px] text-slate-400 font-medium">Total DO Dipilih</p>
                <h3 id="cardTotalDO" class="text-2xl font-black text-amber-400 mt-1">0</h3>
            </div>

            <!-- Card 2: Total Invoice DO -->
            <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-3.5 text-center shadow-md">
                <p class="text-[10px] text-slate-400 font-medium">Total Invoice DO</p>
                <h3 id="cardTotalInvoiceDO" class="text-2xl font-black text-blue-400 mt-1">0</h3>
            </div>

            <!-- Card 3: Total Scan -->
            <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-3.5 text-center shadow-md">
                <p class="text-[10px] text-slate-400 font-medium">Hasil Scan</p>
                <h3 id="cardTotalScan" class="text-2xl font-black text-emerald-400 mt-1">0</h3>
            </div>
        </div>

        <!-- Scanner & Input Form Card -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
            
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-qrcode text-red-400"></i> Scan Invoice
                </h2>
                <button id="btnToggleCamera" onclick="toggleCamera()" class="text-xs bg-red-600 hover:bg-red-500 text-white px-3.5 py-1.5 rounded-xl font-medium transition flex items-center gap-1.5 shadow-lg shadow-red-600/20">
                    <i class="fa-solid fa-camera"></i> <span>Buka Kamera</span>
                </button>
            </div>

            <!-- Kamera Container -->
            <div id="cameraContainer" class="hidden relative overflow-hidden rounded-xl border-2 border-red-500/50 bg-slate-950 min-h-[220px] flex flex-col items-center justify-center">
                <div id="reader" class="w-full"></div>
                <button onclick="stopCamera()" class="absolute top-2 right-2 bg-slate-900/80 hover:bg-slate-900 text-white text-[11px] px-3 py-1.5 rounded-lg backdrop-blur z-10 border border-slate-700">
                    Tutup Kamera
                </button>
            </div>

            <!-- Form Input Manual / Reader Target -->
            <form onsubmit="handleManualSubmit(event)" class="space-y-3 pt-1">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1 font-medium">Nama PIC / Driver</label>
                    <input type="text" id="userPicInput" value="OPERATOR" placeholder="Masukkan nama PIC..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-red-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] text-slate-400 mb-1 font-medium">Kode Invoice / Resi</label>
                    <div class="flex gap-2">
                        <input type="text" id="assetIdInput" placeholder="SCAN / KETIK KODE INVOICE..." required autofocus class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 uppercase tracking-wider focus:outline-none focus:border-red-500 transition">
                        <button type="submit" id="btnSubmit" class="bg-red-600 hover:bg-red-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition flex items-center gap-1.5 shadow-lg shadow-red-600/20">
                            <span>Submit</span>
                            <i class="fa-solid fa-paper-plane text-[10px]"></i>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Alert Notification Box -->
            <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all duration-200 border">
                <i id="alertIcon" class="fa-solid text-base"></i>
                <span id="alertMessage"></span>
            </div>
        </div>

        <!-- Recent History Scan -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-slate-400"></i> Riwayat Scan Baru
                </h3>
                <span class="text-[10px] text-slate-400">Auto Sync ke Sheet Data_Scan</span>
            </div>

            <div id="historyContainer" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                <div class="text-center py-6 text-slate-500 text-xs bg-slate-900/40 rounded-xl border border-slate-800">
                    Belum ada invoice yang ter-scan pada sesi ini
                </div>
            </div>
        </div>

    </main>

    <!-- JS Application Logic -->
    <script>
        // URL WEB APP APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwU8q6zPVrNRQlbkXVdfTUUUDha5kRT2EVk8a060NdBVr0o1q7UzoP7jKzZchJ2sDe7Zg/exec";

        let html5QrCode = null;
        let isScanning = false;
        let isProcessing = false; // Flag penahan spam scan kamera
        let recentLogs = [];

        // Audio Beep Feedback (True = High Pitch, False = Low Pitch Error)
        function playBeep(success = true) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(success ? 880 : 300, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + (success ? 0.12 : 0.3));
            } catch(e) {}
        }

        // Fetch Daftar Kode DO untuk Dropdown Select
        async function loadDOList() {
            const select = document.getElementById("doSelect");
            select.innerHTML = `<option value="">-- Memuat Daftar DO... --</option>`;
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getdolist`);
                const list = await res.json();
                
                select.innerHTML = `<option value="">-- Pilih Kode DO --</option>`;
                if (Array.isArray(list) && list.length > 0) {
                    list.forEach(doCode => {
                        select.innerHTML += `<option value="${doCode}">${doCode}</option>`;
                    });
                } else {
                    select.innerHTML = `<option value="">(Tidak ada data DO)</option>`;
                }
            } catch(e) {
                select.innerHTML = `<option value="">Gagal memuat daftar DO</option>`;
            }
        }

        // Event saat Dropdown DO Diubah
        async function onDOChange() {
            const doCode = document.getElementById("doSelect").value;
            
            if (!doCode) {
                // Reset Cards ke 0 jika belum ada DO yang dipilih
                document.getElementById("cardTotalDO").innerText = "0";
                document.getElementById("cardTotalInvoiceDO").innerText = "0";
                document.getElementById("cardTotalScan").innerText = "0";
                return;
            }

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getstats&doCode=${encodeURIComponent(doCode)}`);
                const data = await res.json();
                
                updateCards(data);
            } catch(e) {}
        }

        // Update Tampilan 3 Cards
        function updateCards(stats) {
            if (!stats) return;
            document.getElementById("cardTotalDO").innerText = stats.totalDO || 0;
            document.getElementById("cardTotalInvoiceDO").innerText = stats.totalInvoiceDO || 0;
            document.getElementById("cardTotalScan").innerText = stats.totalScan || 0;
        }

        // Toggle On/Off Kamera
        async function toggleCamera() {
            if (isScanning) {
                await stopCamera();
            } else {
                await startCamera();
            }
        }

        // Jalankan Kamera Continuous Mode (Standby)
        async function startCamera() {
            const container = document.getElementById('cameraContainer');
            const btn = document.getElementById('btnToggleCamera');
            container.classList.remove('hidden');
            btn.innerHTML = `<i class="fa-solid fa-stop"></i> <span>Tutup Kamera</span>`;

            if (html5QrCode) {
                try { await html5QrCode.clear(); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 230, height: 180 }, aspectRatio: 1.0 };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    async (txt) => {
                        // Jika sedang memproses scan sebelumnya, abaikan frame ini (Debounce)
                        if (isProcessing) return;

                        const scannedCode = txt.toUpperCase().trim();
                        document.getElementById('assetIdInput').value = scannedCode;

                        if (navigator.vibrate) navigator.vibrate(80);
                        
                        isProcessing = true;
                        await submitData();

                        // Cooldown 2.5 detik sebelum siap membaca barcode berikutnya
                        setTimeout(() => {
                            isProcessing = false;
                        }, 2500);
                    }
                );
                isScanning = true;
            } catch (err) {
                showAlert("Gagal mengakses kamera. Pastikan izin kamera aktif.", "error");
                stopCamera();
            }
        }

        // Stop Kamera
        async function stopCamera() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch(e) {}
            }
            isScanning = false;
            isProcessing = false;
            document.getElementById('cameraContainer').classList.add('hidden');
            document.getElementById('btnToggleCamera').innerHTML = `<i class="fa-solid fa-camera"></i> <span>Buka Kamera</span>`;
        }

        // Submit Form Manual
        function handleManualSubmit(e) {
            e.preventDefault();
            submitData();
        }

        // Submit Data Scan ke Backend Apps Script
        async function submitData() {
            const assetInput = document.getElementById("assetIdInput");
            const picInput = document.getElementById("userPicInput");
            const doSelect = document.getElementById("doSelect");
            const btnSubmit = document.getElementById("btnSubmit");

            const assetId = assetInput.value.trim().toUpperCase();
            const doCode = doSelect.value;
            const userPic = picInput.value.trim() || "OPERATOR";

            // Validasi Sisi Client
            if (!doCode) {
                showAlert("Pilih Kode DO terlebih dahulu!", "error");
                playBeep(false);
                return;
            }

            if (!assetId) {
                showAlert("Scan atau masukkan Kode Invoice!", "error");
                playBeep(false);
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

            const payload = {
                assetId: assetId,
                doCode: doCode,
                userPic: userPic
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json();

                if (resData.status === "success") {
                    showAlert(resData.message, "success");
                    playBeep(true);

                    // Tambah ke riwayat lokal web
                    addHistoryLog(assetId, userPic, doCode);

                    // Reset field invoice & update Cards
                    assetInput.value = "";
                    assetInput.focus();

                    if (resData.stats) {
                        updateCards(resData.stats);
                    } else {
                        onDOChange();
                    }

                } else {
                    // Respon ditolak (Misal: Tidak Terdaftar / Duplicate Scan)
                    showAlert(resData.message || "Gagal memproses data", "error");
                    playBeep(false);
                }

            } catch (err) {
                showAlert("Gagal terhubung ke Apps Script API", "error");
                playBeep(false);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>Submit</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>`;
            }
        }

        // Tampilkan Riwayat Scan Lokal Sesi Ini
        function addHistoryLog(code, user, docode) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            recentLogs.unshift({ code, user, docode, time: timeStr });
            if (recentLogs.length > 10) recentLogs.pop(); // Simpan max 10 log

            const container = document.getElementById("historyContainer");
            let html = "";
            
            recentLogs.forEach(log => {
                html += `
                    <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <div>
                                <p class="font-bold text-slate-100 tracking-wider">${log.code}</p>
                                <p class="text-[10px] text-slate-400">PIC: ${log.user} | DO: ${log.docode}</p>
                            </div>
                        </div>
                        <span class="text-[10px] text-slate-400 bg-slate-800 px-2.5 py-1 rounded-md border border-slate-700">${log.time}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Tampilkan Alert Pesan
        function showAlert(msg, type) {
            const box = document.getElementById("alertBox");
            const icon = document.getElementById("alertIcon");
            const text = document.getElementById("alertMessage");

            box.classList.remove("hidden", "bg-emerald-500/20", "text-emerald-300", "border-emerald-500/30", "bg-red-500/20", "text-red-300", "border-red-500/30");

            if (type === "success") {
                box.classList.add("bg-emerald-500/20", "text-emerald-300", "border-emerald-500/30");
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            } else {
                box.classList.add("bg-red-500/20", "text-red-300", "border-red-500/30");
                icon.className = "fa-solid fa-circle-xmark text-red-400";
            }

            text.innerText = msg;
            
            // Sembunyikan alert otomatis setelah 3.5 detik
            setTimeout(() => { 
                box.classList.add("hidden"); 
            }, 3500);
        }

        // Initial Load
        window.addEventListener("DOMContentLoaded", () => {
            loadDOList();
        });
    </script>
</body>
</html>
