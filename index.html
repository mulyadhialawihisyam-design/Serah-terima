<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hand Over J&T Cargo Scanner</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- HTML5-QRCode Library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- SheetJS (styled fork) untuk Export Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
  :root{
    --bg: #0a0f14;
    --panel: #111a22;
    --panel-2: #0d151c;
    --line: #1e2b35;
    --accent: #ff4d4d;
    --accent-2: #ffb020;
    --ok: #22e0a8;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html,body{ background:var(--bg); }
  body{ font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar{ width:5px; height:5px; }
  ::-webkit-scrollbar-thumb{ background:#233240; border-radius:10px; }

  .glass{ background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)); }
  .panel{ background:var(--panel); border:1px solid var(--line); }
  .panel-2{ background:var(--panel-2); border:1px solid var(--line); }

  #reader video{ object-fit:cover !important; border-radius:0.9rem; }

  .scan-line{
    position:absolute; left:6%; right:6%; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scanmove 2.1s ease-in-out infinite;
    box-shadow:0 0 10px 1px var(--accent);
  }
  @keyframes scanmove{
    0%{ top:12%; opacity:.2; } 50%{ top:82%; opacity:1; } 100%{ top:12%; opacity:.2; }
  }

  .card-press:active{ transform: scale(0.97); }
  .chip-in{ animation: chipIn .22s ease-out; }
  @keyframes chipIn{ from{ opacity:0; transform:translateY(4px) scale(.9);} to{ opacity:1; transform:none;} }

  .sheet{ transition: transform .32s cubic-bezier(.32,.72,0,1), opacity .28s ease; }
  .sheet-hidden{ transform: translateY(100%); }
  .backdrop{ transition: opacity .25s ease; }

  .progress-bar-fill{ transition: width .5s cubic-bezier(.4,0,.2,1); }

  .badge-pulse::after{
    content:''; position:absolute; inset:0; border-radius:9999px;
    background:var(--ok); opacity:.5; animation:pulseRing 1.8s infinite;
  }
  @keyframes pulseRing{ 0%{ transform:scale(1); opacity:.55;} 100%{ transform:scale(2.4); opacity:0;} }

  .tab-underline{ position:relative; }
  .tab-underline.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-9px; height:2px;
    background:var(--accent); border-radius:2px;
  }

  input[type="checkbox"].do-check{ accent-color: var(--accent); }
</style>
</head>
<body class="text-slate-100 min-h-screen pb-8">

<!-- Header -->
<header class="sticky top-0 z-40 glass backdrop-blur-md border-b border-slate-800/80" style="background:rgba(10,15,20,.86);">
  <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:rgba(255,77,77,.12); border:1px solid rgba(255,77,77,.35); color:var(--accent);">
        <i class="fa-solid fa-truck-fast text-lg"></i>
      </div>
      <div>
        <h1 class="text-[15px] font-bold leading-tight text-white tracking-tight">Hand Over J&T Cargo</h1>
        <p class="text-[11px] text-slate-500">Serah Terima Delivery Order &amp; Invoice</p>
      </div>
    </div>
    <div class="relative flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full" style="background:rgba(34,224,168,.10); border:1px solid rgba(34,224,168,.3); color:var(--ok);">
      <span class="relative w-1.5 h-1.5 rounded-full" style="background:var(--ok);">
        <span class="badge-pulse absolute inset-0"></span>
      </span>
      <span class="font-semibold">Online</span>
    </div>
  </div>
</header>

<main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

  <!-- Pilih DO (Multi-Select trigger) -->
  <div class="panel rounded-2xl p-4 shadow-lg space-y-3">
    <div class="flex items-center justify-between">
      <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">
        <i class="fa-solid fa-file-invoice mr-1.5" style="color:var(--accent);"></i>Delivery Order Aktif
      </label>
      <button onclick="loadDOList()" title="Refresh Daftar DO" class="text-slate-400 hover:text-slate-200 transition w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-800">
        <i class="fa-solid fa-rotate text-xs"></i>
      </button>
    </div>

    <button onclick="openDOPicker()" class="card-press w-full flex items-center justify-between panel-2 rounded-xl px-3.5 py-3 text-left transition hover:border-slate-600">
      <span id="doPickerLabel" class="text-xs text-slate-400">Ketuk untuk pilih 1 atau lebih Kode DO...</span>
      <i class="fa-solid fa-chevron-down text-slate-500 text-[11px]"></i>
    </button>

    <div id="selectedChips" class="flex flex-wrap gap-1.5"></div>
  </div>

  <!-- 3 Statistic Cards -->
  <div class="grid grid-cols-3 gap-2.5">
    <div class="panel rounded-2xl p-3 text-center">
      <p class="text-[9.5px] text-slate-500 font-semibold uppercase tracking-wide">Total DO</p>
      <h3 id="cardTotalDO" class="text-2xl font-black mt-1" style="color:var(--accent-2);">0</h3>
    </div>
    <div class="panel rounded-2xl p-3 text-center">
      <p class="text-[9.5px] text-slate-500 font-semibold uppercase tracking-wide">Total Invoice</p>
      <h3 id="cardTotalInvoiceDO" class="text-2xl font-black mt-1 text-sky-400">0</h3>
    </div>
    <button onclick="openProgressModal()" class="card-press panel rounded-2xl p-3 text-center relative transition hover:border-emerald-500/50">
      <p class="text-[9.5px] text-slate-500 font-semibold uppercase tracking-wide">Hasil Scan</p>
      <h3 id="cardTotalScan" class="text-2xl font-black mt-1" style="color:var(--ok);">0</h3>
      <i class="fa-solid fa-chevron-right absolute top-2 right-2 text-[9px] text-slate-600"></i>
    </button>
  </div>

  <!-- Export Button -->
  <button onclick="exportExcel()" id="btnExport" class="card-press w-full flex items-center justify-center gap-2 panel-2 border-dashed rounded-xl py-2.5 text-xs font-semibold text-slate-300 hover:text-emerald-400 hover:border-emerald-500/40 transition">
    <i class="fa-solid fa-file-excel text-emerald-500"></i>
    <span>Export / Download Excel Data Scan</span>
  </button>

  <!-- Scanner & Input Form Card -->
  <div class="panel rounded-2xl p-5 shadow-xl space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-qrcode" style="color:var(--accent);"></i> Scan Invoice
      </h2>
      <button id="btnToggleCamera" onclick="toggleCamera()" class="card-press text-xs text-white px-3.5 py-1.5 rounded-xl font-medium transition flex items-center gap-1.5 shadow-lg" style="background:var(--accent); box-shadow:0 6px 16px -6px rgba(255,77,77,.6);">
        <i class="fa-solid fa-camera"></i> <span>Buka Kamera</span>
      </button>
    </div>

    <div id="cameraContainer" class="hidden relative overflow-hidden rounded-xl border-2 min-h-[220px] flex flex-col items-center justify-center" style="border-color:rgba(255,77,77,.4); background:#050a0e;">
      <div id="reader" class="w-full"></div>
      <div class="scan-line"></div>
      <button onclick="stopCamera()" class="absolute top-2 right-2 bg-slate-900/85 hover:bg-slate-900 text-white text-[11px] px-3 py-1.5 rounded-lg backdrop-blur z-10 border border-slate-700">
        Tutup Kamera
      </button>
    </div>

    <form onsubmit="handleManualSubmit(event)" class="space-y-3 pt-1">
      <div>
        <label class="block text-[11px] text-slate-500 mb-1 font-medium">Nama PIC / Driver</label>
        <input type="text" id="userPicInput" value="OPERATOR" placeholder="Masukkan nama PIC..." class="w-full panel-2 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-red-500/60 transition">
      </div>

      <div>
        <label class="block text-[11px] text-slate-500 mb-1 font-medium">Kode Invoice / Resi</label>
        <div class="flex gap-2">
          <input type="text" id="assetIdInput" placeholder="SCAN / KETIK KODE INVOICE..." required autofocus class="flex-1 panel-2 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 uppercase tracking-wider focus:outline-none focus:border-red-500/60 transition">
          <button type="submit" id="btnSubmit" class="card-press text-white font-bold px-4 py-2.5 rounded-xl text-xs transition flex items-center gap-1.5 shadow-lg" style="background:var(--accent); box-shadow:0 6px 16px -6px rgba(255,77,77,.6);">
            <span>Submit</span>
            <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </div>
      </div>
    </form>

    <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 border"></div>
  </div>

  <!-- Recent History -->
  <div class="panel rounded-2xl p-5 space-y-3">
    <div class="flex items-center justify-between">
      <h3 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-slate-500"></i> Riwayat Scan Baru
      </h3>
      <span class="text-[10px] text-slate-500">Auto Sync ke Sheet Data_Scan</span>
    </div>

    <div id="historyContainer" class="space-y-2 max-h-56 overflow-y-auto pr-1">
      <div class="text-center py-6 text-slate-500 text-xs panel-2 rounded-xl">
        Belum ada invoice yang ter-scan pada sesi ini
      </div>
    </div>
  </div>

  <footer class="text-center pt-4 pb-2">
    <p class="text-[10px] tracking-[0.2em] text-slate-600 font-semibold">POWERED BY MULY@.ID</p>
  </footer>
</main>

<!-- ============================================================ -->
<!-- MODAL: DO PICKER (Multi-Select Bottom Sheet)                 -->
<!-- ============================================================ -->
<div id="doPickerBackdrop" class="hidden fixed inset-0 z-50 backdrop-blur-sm" style="background:rgba(0,0,0,.6);" onclick="closeDOPicker()"></div>
<div id="doPickerSheet" class="sheet sheet-hidden fixed left-0 right-0 bottom-0 z-50 max-w-xl mx-auto rounded-t-3xl panel flex flex-col" style="max-height:80vh;">
  <div class="w-10 h-1 rounded-full bg-slate-700 mx-auto mt-3"></div>
  <div class="px-5 pt-3 pb-2 flex items-center justify-between">
    <h3 class="text-sm font-bold text-white">Pilih Kode DO</h3>
    <button onclick="closeDOPicker()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-800"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="px-5 pb-2">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
      <input type="text" id="doSearchInput" oninput="renderDOList()" placeholder="Cari kode DO..." class="w-full panel-2 rounded-xl pl-8 pr-3 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-red-500/60">
    </div>
  </div>
  <div class="px-5 pb-2 flex gap-2 text-[11px]">
    <button onclick="selectAllDO(true)" class="flex-1 py-1.5 rounded-lg panel-2 text-slate-300 font-medium hover:text-emerald-400">Pilih Semua</button>
    <button onclick="selectAllDO(false)" class="flex-1 py-1.5 rounded-lg panel-2 text-slate-300 font-medium hover:text-red-400">Hapus Semua</button>
  </div>
  <div id="doListContainer" class="flex-1 overflow-y-auto px-5 py-2 space-y-1.5"></div>
  <div class="p-4 border-t border-slate-800">
    <button onclick="applyDOSelection()" class="card-press w-full py-3 rounded-xl text-sm font-bold text-white" style="background:var(--accent);">
      Terapkan Pilihan
    </button>
  </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: PROGRES DETAIL (Breakdown + Belum Discan)             -->
<!-- ============================================================ -->
<div id="progressBackdrop" class="hidden fixed inset-0 z-50 backdrop-blur-sm" style="background:rgba(0,0,0,.6);" onclick="closeProgressModal()"></div>
<div id="progressSheet" class="sheet sheet-hidden fixed left-0 right-0 bottom-0 z-50 max-w-xl mx-auto rounded-t-3xl panel flex flex-col" style="max-height:86vh;">
  <div class="w-10 h-1 rounded-full bg-slate-700 mx-auto mt-3"></div>
  <div class="px-5 pt-3 pb-1 flex items-center justify-between">
    <h3 class="text-sm font-bold text-white">Detail Progres DO</h3>
    <button onclick="closeProgressModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-800"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="px-5 pt-3 flex gap-5 border-b border-slate-800">
    <button id="tabBtnRingkasan" onclick="switchModalTab('ringkasan')" class="tab-underline active pb-2.5 text-xs font-semibold text-white">Ringkasan</button>
    <button id="tabBtnBelum" onclick="switchModalTab('belum')" class="tab-underline pb-2.5 text-xs font-semibold text-slate-500">Belum Di-scan</button>
  </div>

  <!-- Tab: Ringkasan -->
  <div id="tabRingkasan" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>

  <!-- Tab: Belum Di-scan -->
  <div id="tabBelum" class="hidden flex-1 overflow-y-auto px-5 py-4 space-y-3">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
      <input type="text" id="unscannedSearch" oninput="renderUnscannedList()" placeholder="Cari kode invoice..." class="w-full panel-2 rounded-xl pl-8 pr-3 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-red-500/60">
    </div>
    <div id="unscannedListContainer" class="space-y-1.5"></div>
  </div>
</div>

<!-- Toast kecil untuk konfirmasi export -->
<div id="miniToast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-xs font-semibold text-white shadow-2xl" style="background:#152018; border:1px solid rgba(34,224,168,.4);"></div>

<script>
  // ==========================================================================
  // CONFIG
  // ==========================================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwU8q6zPVrNRQlbkXVdfTUUUDha5kRT2EVk8a060NdBVr0o1q7UzoP7jKzZchJ2sDe7Zg/exec";

  let html5QrCode = null;
  let isScanning = false;
  let isProcessing = false;
  let recentLogs = [];

  let allDOList = [];          // Semua kode DO dari server
  let selectedDOs = [];        // DO yang sudah diterapkan (aktif dipakai)
  let pendingDOs = [];         // DO yang sedang dicentang di dalam picker (belum diterapkan)
  let lastStatsData = null;    // Cache hasil getstats terakhir (untuk modal ringkasan)
  let lastUnscannedList = [];  // Cache hasil getunscanned terakhir

  // ==========================================================================
  // AUDIO FEEDBACK
  // ==========================================================================
  function playBeep(success = true) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(success ? 880 : 300, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + (success ? 0.12 : 0.3));
    } catch (e) {}
  }

  function vibrate(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
  }

  // ==========================================================================
  // DO LIST + MULTI-SELECT PICKER
  // ==========================================================================
  async function loadDOList() {
    document.getElementById("doPickerLabel").innerText = "Memuat daftar DO...";
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getdolist`);
      const list = await res.json();
      allDOList = Array.isArray(list) ? list : [];
      updateDOPickerLabel();
    } catch (e) {
      allDOList = [];
      showAlert("Gagal memuat daftar DO dari server", "error");
    }
  }

  function openDOPicker() {
    pendingDOs = [...selectedDOs];
    document.getElementById("doSearchInput").value = "";
    renderDOList();
    document.getElementById("doPickerBackdrop").classList.remove("hidden");
    const sheet = document.getElementById("doPickerSheet");
    sheet.classList.remove("hidden");
    requestAnimationFrame(() => sheet.classList.remove("sheet-hidden"));
  }

  function closeDOPicker() {
    const sheet = document.getElementById("doPickerSheet");
    sheet.classList.add("sheet-hidden");
    setTimeout(() => {
      sheet.classList.add("hidden");
      document.getElementById("doPickerBackdrop").classList.add("hidden");
    }, 280);
  }

  function renderDOList() {
    const query = document.getElementById("doSearchInput").value.trim().toUpperCase();
    const container = document.getElementById("doListContainer");

    const filtered = allDOList.filter(d => d.includes(query));
    if (filtered.length === 0) {
      container.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">Tidak ada Kode DO ditemukan</div>`;
      return;
    }

    container.innerHTML = filtered.map(d => {
      const checked = pendingDOs.includes(d) ? "checked" : "";
      return `
        <label class="flex items-center gap-3 panel-2 rounded-xl px-3.5 py-3 cursor-pointer transition hover:border-slate-600">
          <input type="checkbox" class="do-check w-4 h-4 rounded" ${checked} onchange="toggleDOCheckbox('${d}', this.checked)">
          <span class="text-xs font-medium text-slate-200 tracking-wide">${d}</span>
        </label>
      `;
    }).join("");
  }

  function toggleDOCheckbox(code, isChecked) {
    if (isChecked) {
      if (!pendingDOs.includes(code)) pendingDOs.push(code);
    } else {
      pendingDOs = pendingDOs.filter(d => d !== code);
    }
  }

  function selectAllDO(select) {
    const query = document.getElementById("doSearchInput").value.trim().toUpperCase();
    const filtered = allDOList.filter(d => d.includes(query));
    if (select) {
      filtered.forEach(d => { if (!pendingDOs.includes(d)) pendingDOs.push(d); });
    } else {
      pendingDOs = pendingDOs.filter(d => !filtered.includes(d));
    }
    renderDOList();
  }

  function applyDOSelection() {
    selectedDOs = [...pendingDOs];
    closeDOPicker();
    renderSelectedChips();
    updateDOPickerLabel();
    fetchStats();
  }

  function removeSelectedDO(code) {
    selectedDOs = selectedDOs.filter(d => d !== code);
    renderSelectedChips();
    updateDOPickerLabel();
    fetchStats();
  }

  function updateDOPickerLabel() {
    const label = document.getElementById("doPickerLabel");
    if (selectedDOs.length === 0) {
      label.innerText = "Ketuk untuk pilih 1 atau lebih Kode DO...";
      label.classList.add("text-slate-400");
    } else {
      label.innerText = `${selectedDOs.length} Kode DO Dipilih`;
      label.classList.remove("text-slate-400");
    }
  }

  function renderSelectedChips() {
    const container = document.getElementById("selectedChips");
    if (selectedDOs.length === 0) {
      container.innerHTML = "";
      return;
    }
    container.innerHTML = selectedDOs.map(d => `
      <span class="chip-in inline-flex items-center gap-1.5 text-[10.5px] font-semibold pl-2.5 pr-1.5 py-1 rounded-full" style="background:rgba(255,77,77,.12); border:1px solid rgba(255,77,77,.35); color:#ff8a8a;">
        ${d}
        <button onclick="removeSelectedDO('${d}')" class="w-4 h-4 rounded-full flex items-center justify-center hover:bg-red-500/30">
          <i class="fa-solid fa-xmark text-[9px]"></i>
        </button>
      </span>
    `).join("");
  }

  // ==========================================================================
  // STATISTIK (MULTI-DO)
  // ==========================================================================
  async function fetchStats() {
    if (selectedDOs.length === 0) {
      updateCards({ totalDO: 0, totalInvoiceDO: 0, totalScan: 0, breakdown: [] });
      return;
    }
    try {
      const csv = encodeURIComponent(selectedDOs.join(","));
      const res = await fetch(`${SCRIPT_URL}?action=getstats&doCodes=${csv}`);
      const data = await res.json();
      updateCards(data);
    } catch (e) {
      showAlert("Gagal mengambil statistik dari server", "error");
    }
  }

  function updateCards(stats) {
    if (!stats) return;
    lastStatsData = stats;
    document.getElementById("cardTotalDO").innerText = stats.totalDO || 0;
    document.getElementById("cardTotalInvoiceDO").innerText = stats.totalInvoiceDO || 0;
    document.getElementById("cardTotalScan").innerText = stats.totalScan || 0;
  }

  // ==========================================================================
  // MODAL PROGRES: RINGKASAN + BELUM DI-SCAN
  // ==========================================================================
  function openProgressModal() {
    if (selectedDOs.length === 0) {
      showAlert("Pilih Kode DO terlebih dahulu untuk melihat detail progres", "error");
      return;
    }
    switchModalTab("ringkasan");
    renderRingkasanTab();
    loadUnscannedForModal();

    document.getElementById("progressBackdrop").classList.remove("hidden");
    const sheet = document.getElementById("progressSheet");
    sheet.classList.remove("hidden");
    requestAnimationFrame(() => sheet.classList.remove("sheet-hidden"));
  }

  function closeProgressModal() {
    const sheet = document.getElementById("progressSheet");
    sheet.classList.add("sheet-hidden");
    setTimeout(() => {
      sheet.classList.add("hidden");
      document.getElementById("progressBackdrop").classList.add("hidden");
    }, 280);
  }

  function switchModalTab(tab) {
    const ringkasanTab = document.getElementById("tabRingkasan");
    const belumTab = document.getElementById("tabBelum");
    const btnRingkasan = document.getElementById("tabBtnRingkasan");
    const btnBelum = document.getElementById("tabBtnBelum");

    if (tab === "ringkasan") {
      ringkasanTab.classList.remove("hidden");
      belumTab.classList.add("hidden");
      btnRingkasan.classList.add("active", "text-white");
      btnRingkasan.classList.remove("text-slate-500");
      btnBelum.classList.remove("active", "text-white");
      btnBelum.classList.add("text-slate-500");
    } else {
      ringkasanTab.classList.add("hidden");
      belumTab.classList.remove("hidden");
      btnBelum.classList.add("active", "text-white");
      btnBelum.classList.remove("text-slate-500");
      btnRingkasan.classList.remove("active", "text-white");
      btnRingkasan.classList.add("text-slate-500");
    }
  }

  function renderRingkasanTab() {
    const container = document.getElementById("tabRingkasan");
    const breakdown = (lastStatsData && lastStatsData.breakdown) || [];

    if (breakdown.length === 0) {
      container.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">Belum ada data</div>`;
      return;
    }

    container.innerHTML = breakdown.map(b => {
      const barColor = b.percent >= 100 ? "#22e0a8" : (b.percent >= 50 ? "#ffb020" : "#ff4d4d");
      return `
        <div class="panel-2 rounded-xl p-3.5 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-white tracking-wide">${b.doCode}</span>
            <span class="text-[10px] font-bold" style="color:${barColor};">${b.percent}%</span>
          </div>
          <div class="w-full h-1.5 rounded-full bg-slate-800 overflow-hidden">
            <div class="progress-bar-fill h-full rounded-full" style="width:${b.percent}%; background:${barColor};"></div>
          </div>
          <div class="flex items-center justify-between text-[10.5px] text-slate-400">
            <span>Total Invoice: <b class="text-slate-200">${b.totalInvoice}</b></span>
            <span>Sudah: <b class="text-emerald-400">${b.totalScan}</b></span>
            <span>Belum: <b class="text-red-400">${b.totalBelum}</b></span>
          </div>
        </div>
      `;
    }).join("");
  }

  async function loadUnscannedForModal() {
    const container = document.getElementById("unscannedListContainer");
    container.innerHTML = `<div class="text-center text-xs text-slate-500 py-8"><i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Memuat data...</div>`;
    try {
      const csv = encodeURIComponent(selectedDOs.join(","));
      const res = await fetch(`${SCRIPT_URL}?action=getunscanned&doCodes=${csv}`);
      const list = await res.json();
      lastUnscannedList = Array.isArray(list) ? list : [];
      renderUnscannedList();
    } catch (e) {
      lastUnscannedList = [];
      container.innerHTML = `<div class="text-center text-xs text-red-400 py-8">Gagal memuat data</div>`;
    }
  }

  function renderUnscannedList() {
    const query = (document.getElementById("unscannedSearch").value || "").trim().toUpperCase();
    const container = document.getElementById("unscannedListContainer");

    const filtered = lastUnscannedList.filter(item =>
      item.invoice.includes(query) || item.doCode.includes(query)
    );

    if (filtered.length === 0) {
      container.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">
        <i class="fa-solid fa-circle-check text-emerald-500 text-lg mb-2 block"></i>
        Tidak ada invoice yang belum di-scan
      </div>`;
      return;
    }

    container.innerHTML = filtered.map(item => `
      <div class="flex items-center justify-between panel-2 rounded-xl px-3.5 py-2.5">
        <span class="text-xs font-semibold text-slate-200 tracking-wide">${item.invoice}</span>
        <span class="text-[10px] font-medium text-slate-500 px-2 py-0.5 rounded-md bg-slate-800/70">${item.doCode}</span>
      </div>
    `).join("");
  }

  // ==========================================================================
  // KAMERA SCANNER
  // ==========================================================================
  async function toggleCamera() {
    if (isScanning) { await stopCamera(); } else { await startCamera(); }
  }

  async function startCamera() {
    const container = document.getElementById('cameraContainer');
    const btn = document.getElementById('btnToggleCamera');
    container.classList.remove('hidden');
    btn.innerHTML = `<i class="fa-solid fa-stop"></i> <span>Tutup Kamera</span>`;

    if (html5QrCode) { try { await html5QrCode.clear(); } catch (e) {} }

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 15, qrbox: { width: 230, height: 180 }, aspectRatio: 1.0 };

    try {
      await html5QrCode.start(
        { facingMode: "environment" },
        config,
        async (txt) => {
          if (isProcessing) return;
          const scannedCode = txt.toUpperCase().trim();
          document.getElementById('assetIdInput').value = scannedCode;
          vibrate(80);
          isProcessing = true;
          await submitData();
          setTimeout(() => { isProcessing = false; }, 2500);
        }
      );
      isScanning = true;
    } catch (err) {
      showAlert("Gagal mengakses kamera. Pastikan izin kamera aktif.", "error");
      stopCamera();
    }
  }

  async function stopCamera() {
    if (html5QrCode && isScanning) {
      try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
    }
    isScanning = false;
    isProcessing = false;
    document.getElementById('cameraContainer').classList.add('hidden');
    document.getElementById('btnToggleCamera').innerHTML = `<i class="fa-solid fa-camera"></i> <span>Buka Kamera</span>`;
  }

  // ==========================================================================
  // SUBMIT SCAN
  // ==========================================================================
  function handleManualSubmit(e) {
    e.preventDefault();
    submitData();
  }

  async function submitData() {
    const assetInput = document.getElementById("assetIdInput");
    const picInput = document.getElementById("userPicInput");
    const btnSubmit = document.getElementById("btnSubmit");

    const assetId = assetInput.value.trim().toUpperCase();
    const userPic = picInput.value.trim() || "OPERATOR";

    if (selectedDOs.length === 0) {
      showAlert("Pilih minimal 1 Kode DO terlebih dahulu!", "error");
      playBeep(false); vibrate([50, 40, 50]);
      return;
    }
    if (!assetId) {
      showAlert("Scan atau masukkan Kode Invoice!", "error");
      playBeep(false);
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

    const payload = { assetId, doCodes: selectedDOs, userPic };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const resData = await response.json();

      if (resData.status === "success") {
        showAlert(resData.message, "success");
        playBeep(true);
        vibrate(60);

        addHistoryLog(assetId, userPic, resData.doCode || "-");

        assetInput.value = "";
        assetInput.focus();

        if (resData.stats) {
          updateCards(resData.stats);
        } else {
          fetchStats();
        }
      } else {
        showAlert(resData.message || "Gagal memproses data", "error");
        playBeep(false);
        vibrate([50, 40, 50]);
      }

    } catch (err) {
      showAlert("Gagal terhubung ke Apps Script API", "error");
      playBeep(false);
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = `<span>Submit</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>`;
    }
  }

  function addHistoryLog(code, user, docode) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    recentLogs.unshift({ code, user, docode, time: timeStr });
    if (recentLogs.length > 10) recentLogs.pop();

    const container = document.getElementById("historyContainer");
    container.innerHTML = recentLogs.map(log => `
      <div class="chip-in panel-2 rounded-xl p-3 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2.5">
          <span class="w-2 h-2 rounded-full" style="background:var(--ok);"></span>
          <div>
            <p class="font-bold text-slate-100 tracking-wider">${log.code}</p>
            <p class="text-[10px] text-slate-500">PIC: ${log.user} | DO: ${log.docode}</p>
          </div>
        </div>
        <span class="text-[10px] text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-md border border-slate-700">${log.time}</span>
      </div>
    `).join("");
  }

  function showAlert(msg, type) {
    const box = document.getElementById("alertBox");
    box.className = "p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 border";
    if (type === "success") {
      box.style.background = "rgba(34,224,168,.12)";
      box.style.borderColor = "rgba(34,224,168,.35)";
      box.style.color = "#5eead4";
      box.innerHTML = `<i class="fa-solid fa-circle-check text-base" style="color:var(--ok);"></i><span>${msg}</span>`;
    } else {
      box.style.background = "rgba(255,77,77,.12)";
      box.style.borderColor = "rgba(255,77,77,.35)";
      box.style.color = "#ffb4b4";
      box.innerHTML = `<i class="fa-solid fa-circle-xmark text-base" style="color:var(--accent);"></i><span>${msg}</span>`;
    }
    setTimeout(() => { box.classList.add("hidden"); }, 3500);
  }

  function showMiniToast(msg) {
    const toast = document.getElementById("miniToast");
    toast.innerText = msg;
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 2800);
  }

  // ==========================================================================
  // EXPORT EXCEL (SheetJS - Styled)
  // ==========================================================================
  async function exportExcel() {
    if (selectedDOs.length === 0) {
      showAlert("Pilih minimal 1 Kode DO untuk melakukan export!", "error");
      return;
    }

    const btn = document.getElementById("btnExport");
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Menyiapkan file...</span>`;

    try {
      const csv = encodeURIComponent(selectedDOs.join(","));
      const res = await fetch(`${SCRIPT_URL}?action=getexport&doCodes=${csv}`);
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        showAlert("Tidak ada data scan untuk DO yang dipilih", "error");
        return;
      }

      const headerRow = ["Invoice", "Nomor DO", "Waktu Scan", "PIC / User"];
      const rows = data.map(d => [d.invoice, d.doCode, d.waktu, d.userPic || "-"]);
      const sheetData = [headerRow, ...rows];

      const ws = XLSX.utils.aoa_to_sheet(sheetData);

      // Styling header
      const headerStyle = {
        fill: { fgColor: { rgb: "FF4D4D" } },
        font: { bold: true, color: { rgb: "FFFFFF" }, sz: 11 },
        alignment: { horizontal: "center", vertical: "center" },
        border: {
          bottom: { style: "thin", color: { rgb: "000000" } }
        }
      };
      const cellBorder = {
        border: {
          top: { style: "thin", color: { rgb: "DDDDDD" } },
          bottom: { style: "thin", color: { rgb: "DDDDDD" } },
          left: { style: "thin", color: { rgb: "DDDDDD" } },
          right: { style: "thin", color: { rgb: "DDDDDD" } }
        },
        alignment: { vertical: "center" }
      };

      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let C = range.s.c; C <= range.e.c; C++) {
        const headerAddr = XLSX.utils.encode_cell({ r: 0, c: C });
        if (ws[headerAddr]) ws[headerAddr].s = headerStyle;
      }
      for (let R = 1; R <= range.e.r; R++) {
        for (let C = range.s.c; C <= range.e.c; C++) {
          const addr = XLSX.utils.encode_cell({ r: R, c: C });
          if (ws[addr]) {
            ws[addr].s = Object.assign({}, cellBorder, {
              fill: { fgColor: { rgb: R % 2 === 0 ? "FFF5F5" : "FFFFFF" } }
            });
          }
        }
      }

      // Auto-fit lebar kolom (perkiraan berbasis panjang konten)
      const colWidths = headerRow.map((h, colIdx) => {
        let maxLen = h.length;
        rows.forEach(r => {
          const val = String(r[colIdx] || "");
          if (val.length > maxLen) maxLen = val.length;
        });
        return { wch: maxLen + 4 };
      });
      ws['!cols'] = colWidths;
      ws['!rows'] = [{ hpt: 22 }];

      const wb = XLSX.utils.book_new();
      const sheetLabel = selectedDOs.length === 1 ? selectedDOs[0].replace(/[^A-Z0-9]/gi, "_").slice(0, 28) : "Multi_DO";
      XLSX.utils.book_append_sheet(wb, ws, sheetLabel || "Data Scan");

      const now = new Date();
      const stamp = Utilities_formatStamp(now);
      const filename = `HandOver_${sheetLabel}_${stamp}.xlsx`;

      XLSX.writeFile(wb, filename);
      showMiniToast(`Berhasil export ${rows.length} data ke ${filename}`);
      vibrate(50);

    } catch (e) {
      showAlert("Gagal membuat file export Excel", "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  function Utilities_formatStamp(d) {
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  }

  // ==========================================================================
  // INIT
  // ==========================================================================
  window.addEventListener("DOMContentLoaded", () => {
    loadDOList();
    updateDOPickerLabel();
  });
</script>
