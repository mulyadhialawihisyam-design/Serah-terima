<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Over J&T Cargo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #reader video { object-fit: cover !important; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400">
                    <i class="fa-solid fa-truck-fast text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white">Hand Over J&T Cargo</h1>
                    <p class="text-xs text-slate-400">Serah Terima DO & Invoice</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-5 space-y-5">

        <!-- Pilihan Kode DO -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4">
            <label class="block text-xs font-semibold text-slate-300 mb-2">
                <i class="fa-solid fa-file-invoice text-red-400 mr-1"></i> Pilih / Input Kode Delivery Order (DO)
            </label>
            <div class="flex gap-2">
                <select id="doSelect" onchange="onDOChange()" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-red-500">
                    <option value="">-- Memuat Daftar DO --</option>
                </select>
                <button onclick="loadDOList()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2.5 rounded-xl text-xs">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- 3 STATISTIC CARDS -->
        <div class="grid grid-cols-3 gap-3">
            <!-- Card 1: Total DO -->
            <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-3 text-center">
                <p class="text-[10px] text-slate-400 font-medium">Total DO Dipilih</p>
                <h3 id="cardTotalDO" class="text-xl font-black text-amber-400 mt-1">0</h3>
            </div>

            <!-- Card 2: Total Invoice DO -->
            <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-3 text-center">
                <p class="text-[10px] text-slate-400 font-medium">Total Invoice DO</p>
                <h3 id="cardTotalInvoiceDO" class="text-xl font-black text-blue-400 mt-1">0</h3>
            </div>

            <!-- Card 3: Total Scan -->
            <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-3 text-center">
                <p class="text-[10px] text-slate-400 font-medium">Hasil Scan</p>
                <h3 id="cardTotalScan" class="text-xl font-black text-emerald-400 mt-1">0</h3>
            </div>
        </div>

        <!-- Form Scan & Input -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-semibold text-slate-200">
                    <i class="fa-solid fa-qrcode text-red-400"></i> Scan Invoice
                </h2>
                <button id="btnToggleCamera" onclick="toggleCamera()" class="text-xs bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-camera"></i> Kamera
                </button>
            </div>

            <!-- Kamera -->
            <div id="cameraContainer" class="hidden relative overflow-hidden rounded-xl border-2 border-red-500/50 bg-slate-950 min-h-[200px]">
                <div id="reader" class="w-full"></div>
                <button onclick="stopCamera()" class="absolute top-2 right-2 bg-slate-900/80 text-white text-[10px] px-2 py-1 rounded-md">Tutup</button>
            </div>

            <form onsubmit="handleManualSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Nama PIC / Driver</label>
                    <input type="text" id="userPicInput" value="OPERATOR" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Kode Invoice / Resi</label>
                    <div class="flex gap-2">
                        <input type="text" id="assetIdInput" placeholder="Scan / Ketik Kode Invoice..." required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 uppercase">
                        <button type="submit" id="btnSubmit" class="bg-red-600 hover:bg-red-500 font-bold px-4 py-2 rounded-xl text-xs">Submit</button>
                    </div>
                </div>
            </form>

            <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-semibold"></div>
        </div>

    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwU8q6zPVrNRQlbkXVdfTUUUDha5kRT2EVk8a060NdBVr0o1q7UzoP7jKzZchJ2sDe7Zg/exec";
        let html5QrCode = null;
        let isScanning = false;

        async function loadDOList() {
            const select = document.getElementById("doSelect");
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getdolist`);
                const list = await res.json();
                select.innerHTML = `<option value="">-- Pilih Kode DO --</option>`;
                list.forEach(doCode => {
                    select.innerHTML += `<option value="${doCode}">${doCode}</option>`;
                });
            } catch(e) {
                select.innerHTML = `<option value="">Gagal memuat DO</option>`;
            }
        }

        async function onDOChange() {
            const doCode = document.getElementById("doSelect").value;
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getstats&doCode=${encodeURIComponent(doCode)}`);
                const data = await res.json();
                
                document.getElementById("cardTotalDO").innerText = data.totalDO || 0;
                document.getElementById("cardTotalInvoiceDO").innerText = data.totalInvoiceDO || 0;
                document.getElementById("cardTotalScan").innerText = data.totalScan || 0;
            } catch(e) {}
        }

        async function toggleCamera() {
            if (isScanning) { await stopCamera(); } else { await startCamera(); }
        }

        async function startCamera() {
            document.getElementById('cameraContainer').classList.remove('hidden');
            if (html5QrCode) { try { await html5QrCode.clear(); } catch(e){} }
            html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 200 }, (txt) => {
                    document.getElementById('assetIdInput').value = txt.toUpperCase().trim();
                    stopCamera();
                    submitData();
                });
                isScanning = true;
            } catch(e) { stopCamera(); }
        }

        async function stopCamera() {
            if (html5QrCode && isScanning) { try { await html5QrCode.stop(); } catch(e){} }
            isScanning = false;
            document.getElementById('cameraContainer').classList.add('hidden');
        }

        function handleManualSubmit(e) { e.preventDefault(); submitData(); }

        async function submitData() {
            const assetId = document.getElementById("assetIdInput").value.trim().toUpperCase();
            const doCode = document.getElementById("doSelect").value;
            const userPic = document.getElementById("userPicInput").value.trim() || "OPERATOR";

            if (!assetId) return;

            const payload = { assetId, doCode, userPic };
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === "success") {
                    showAlert("Berhasil ter-scan", "success");
                    document.getElementById("assetIdInput").value = "";
                    onDOChange(); // Auto refresh 3 Card angka
                }
            } catch(e) { showAlert("Gagal menyimpan", "error"); }
        }

        function showAlert(msg, type) {
            const box = document.getElementById("alertBox");
            box.classList.remove("hidden", "bg-emerald-500/20", "text-emerald-300", "bg-red-500/20", "text-red-300");
            box.classList.add(type === "success" ? "bg-emerald-500/20" : "bg-red-500/20", type === "success" ? "text-emerald-300" : "text-red-300");
            box.innerText = msg;
            setTimeout(() => box.classList.add("hidden"), 3000);
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadDOList();
            onDOChange();
        });
    </script>
</body>
</html>
